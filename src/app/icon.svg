<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Sous 24 px le grain du tampon ne fait que salir : la marque se réduit
       à « PB », bloc plein, bords vifs. Pas de dégradé, pas d'arrondi. -->
  <rect width="32" height="32" fill="#1F3FBF"/>
  <text x="16" y="23" text-anchor="middle" textLength="23" lengthAdjust="spacingAndGlyphs"
        font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="17" letter-spacing="-0.5" fill="#F2F1EE">PB</text>
</svg>
